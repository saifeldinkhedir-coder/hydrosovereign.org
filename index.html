// COPY LINK
function doCopy() {
  var url = 'https://saifeldinkhedir-coder.github.io/hydrosovereign.org/';
  function ok() {
    var ic = document.getElementById('copy-icon');
    var lb = document.getElementById('copy-lbl');
    var b1 = document.getElementById('copy-btn');
    var b2 = document.getElementById('copy-btn-f');
    if (ic) ic.innerHTML = '<polyline points="4 12 9 17 20 6" stroke="#68D391" stroke-width="2.5" fill="none"/>';
    if (lb) { lb.textContent = '✓'; lb.style.color = '#68D391'; }
    if (b1) b1.style.background = '#276749';
    if (b2) { b2.textContent = '✓ Copied!'; b2.style.background = 'rgba(39,103,73,.5)'; }
    setTimeout(function() {
      if (ic) ic.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
      if (lb) { lb.textContent = 'url'; lb.style.color = ''; }
      if (b1) b1.style.background = '';
      if (b2) { b2.textContent = 'Copy Link'; b2.style.background = ''; }
    }, 3000);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(ok).catch(function() { leg(url, ok); });
  } else { leg(url, ok); }
}
function leg(url, cb) {
  var ta = document.createElement('textarea');
  ta.value = url; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:absolute;left:-9999px;top:-9999px;font-size:12pt';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); cb(); }
  catch(e) { window.prompt('Copy this link (Ctrl+C / Cmd+C):', url); }
  document.body.removeChild(ta);
}

// CONTACT FORM
function submitForm() {
  var n = ((document.getElementById('cf-n')||{}).value||'').trim();
  var e = ((document.getElementById('cf-e')||{}).value||'').trim();
  var t = (document.getElementById('cf-t')||{}).value||'';
  var s = ((document.getElementById('cf-s')||{}).value||'').trim();
  var m = ((document.getElementById('cf-m')||{}).value||'').trim();
  if (!n) { alert('Please enter your name.'); return; }
  if (!e || e.indexOf('@') < 0) { alert('Please enter a valid email.'); return; }
  if (!m) { alert('Please write your message.'); return; }
  var sub  = encodeURIComponent((s || 'HydroSovereign Enquiry') + ' from ' + n);
  var body = encodeURIComponent('Name: '+n+'\nEmail: '+e+'\nRole: '+(t||'Not specified')+'\n\n'+m);
  window.location.href = 'mailto:saifeldinkhedir@gmail.com?subject='+sub+'&body='+body;
}
